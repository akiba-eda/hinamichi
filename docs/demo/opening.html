<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:540px;height:1200px;overflow:hidden;background:#F7F5F0;font-family:"Noto Sans JP",sans-serif;color:#2B2B2B;font-feature-settings:"palt"}
.wrap{width:540px;height:1200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:60px 48px;text-align:center}
.face{width:250px;height:250px;object-fit:contain}
.logo{width:330px;height:auto}
.sen{font-size:22px;font-weight:900;letter-spacing:.14em;margin-top:6px}
.sen span{display:block;font-size:12px;font-weight:400;letter-spacing:.18em;color:#7A7570;margin-top:4px}
.line{width:56px;height:3px;background:#F2C94C;border-radius:2px}
.catch{font-size:24px;font-weight:900;line-height:1.5}
.sub{font-size:14px;color:#7A7570;line-height:1.7}
.chip{margin-top:8px;font-size:12px;font-weight:700;background:#fff;padding:8px 18px;border-radius:99px}
.chip b{color:#E38B1C}
</style></head><body><div class="wrap">
  <img class="face" src="../../app/assets/senavi/smile.png" alt="">
  <img class="logo" src="../poster/logo_cut.png" alt="ヒナミチ">
  <div class="sen">セナヴィ<span>SENAvi — Safety Navigator AI</span></div>
  <div class="line"></div>
  <div class="catch">逃げる先を、<br>あなたの代わりに決める。</div>
  <p class="sub">ふだんは雨雲レーダーと位置共有。<br>災害の日は、避難経路を自動で決める。</p>
  <div class="chip"><b>AI HACK 2026</b> 応募作品</div>
</div></body></html>
