name: hinamichi
description: ヒナミチ — 災害時、あなたの代わりに判断して安全な道へ案内するAIナビゲーター(セナヴィ)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  battery_plus: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/senavi/
    - assets/senavi_small/
    - assets/brand/
    - assets/map/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon_1024.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FCEEDD"
  adaptive_icon_foreground: assets/brand/app_icon_adaptive_fg.png
